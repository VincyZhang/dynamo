name: XPU-Deploy

on:
  workflow_dispatch:
    inputs:
      framework:
        description: 'Framework name (vllm)'
        required: false
        type: string
        default: 'vllm'
      source_ref:
        description: 'Git ref/SHA to checkout. Empty = current SHA.'
        required: false
        type: string
        default: ''
      registry_host:
        description: 'Local registry host to push images to.'
        required: false
        type: string
        default: 'localhost:5000'
  workflow_call:
    inputs:
      framework:
        description: 'Framework name (vllm)'
        required: false
        type: string
        default: 'vllm'
      source_ref:
        description: 'Git ref/SHA to checkout. Empty = caller SHA.'
        required: false
        type: string
        default: ''
      registry_host:
        description: 'Local registry host to push images to.'
        required: false
        type: string
        default: 'localhost:5000'
    secrets:
      HF_TOKEN:
        required: true
      DOCKERHUB_LOGIN_USER:
        required: true
      DOCKERHUB_ACCESS_TOKEN:
        required: true

env:
  FRAMEWORK: ${{ inputs.framework || 'vllm' }}
  SOURCE_REF: ${{ inputs.source_ref || github.sha }}
  LOCAL_REGISTRY: ${{ inputs.registry_host || 'localhost:5000' }}
  TARGET: runtime
  DEVICE: xpu
  PLATFORM: linux/amd64

jobs:
  deploy-test-xpu:
    runs-on: xpu-deploy
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - profile: agg_xpu_dra
            name: agg_xpu_dra
            slug: agg-xpu-dra
          - profile: disagg_xpu_dra
            name: disagg_xpu_dra
            slug: disagg-xpu-dra
    name: ${{ matrix.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Generate Dockerfile
        shell: bash
        run: |
          echo "::group::Generating XPU Dockerfile"
          python3 ./container/render.py \
              --target=${{ env.TARGET }} \
              --framework=${{ env.FRAMEWORK }} \
              --device=${{ env.DEVICE }} \
              --platform=${{ env.PLATFORM }} \
              --show-result \
              --output-short-filename
          echo "::endgroup::"

      - name: Build local XPU image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_URI="${LOCAL_REGISTRY}/ai-dynamo/dynamo:${SOURCE_REF}-${FRAMEWORK}-${TARGET}-xpu"

          docker build \
            --tag "${IMAGE_URI}" \
            -f ./container/rendered.Dockerfile \
            . 2>&1 | tee "build-${{ matrix.name }}.log"

          docker push "${IMAGE_URI}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Provision isolated vCluster and operator
        id: isolated-cluster
        shell: bash
        env:
          MATRIX_NAME: ${{ matrix.name }}
          MATRIX_SLUG: ${{ matrix.slug }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          VCLUSTER_NAME="ci-${GITHUB_RUN_ID}-${MATRIX_SLUG}-xpu"
          NAMESPACE="gh-id-${GITHUB_RUN_ID}-${MATRIX_SLUG}-xpu"
          OPERATOR_TAG="1.2.1"
          PF_LOG="${GITHUB_WORKSPACE}/.vcluster-port-forward-${MATRIX_SLUG}.log"
          PF_PID_FILE="${GITHUB_WORKSPACE}/.vcluster-port-forward-${MATRIX_SLUG}.pid"
          KUBECONFIG_PATH="${GITHUB_WORKSPACE}/.kubeconfig-vcluster"

          # Tunables for vcluster control plane and DNS to reduce startup flakiness.
          VC_CP_REQ_CPU="250m"
          VC_CP_REQ_MEM="512Mi"
          VC_CP_LIM_CPU="1"
          VC_CP_LIM_MEM="1Gi"
          VC_DNS_REQ_CPU="100m"
          VC_DNS_REQ_MEM="128Mi"
          VC_DNS_LIM_CPU="500m"
          VC_DNS_LIM_MEM="256Mi"

          echo "vcluster_name=${VCLUSTER_NAME}" >> "$GITHUB_OUTPUT"
          echo "namespace=${NAMESPACE}" >> "$GITHUB_OUTPUT"
          echo "operator_tag=${OPERATOR_TAG}" >> "$GITHUB_OUTPUT"

          if ! command -v vcluster >/dev/null 2>&1; then
            mkdir -p "${HOME}/.local/bin"
            curl -fsSL "https://github.com/loft-sh/vcluster/releases/download/v0.34.2/vcluster-linux-amd64" -o "${HOME}/.local/bin/vcluster"
            chmod +x "${HOME}/.local/bin/vcluster"
          fi
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          export PATH="${HOME}/.local/bin:${PATH}"

          if ! command -v helm >/dev/null 2>&1; then
            echo "::error::helm binary is required on xpu-deploy runner but was not found"
            exit 1
          fi

          cleanup_port_forward() {
            if [[ -f "${PF_PID_FILE}" ]]; then
              PF_PID="$(cat "${PF_PID_FILE}")"
              if [[ -n "${PF_PID}" ]]; then
                kill "${PF_PID}" >/dev/null 2>&1 || true
              fi
              rm -f "${PF_PID_FILE}"
            fi
          }

          cleanup_namespace() {
            kubectl --kubeconfig="${HOST_KUBECONFIG}" delete namespace "${NAMESPACE}" --ignore-not-found=true --timeout=180s >/dev/null 2>&1 || true
            for _ in $(seq 1 60); do
              if ! kubectl --kubeconfig="${HOST_KUBECONFIG}" get namespace "${NAMESPACE}" >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done

            echo "::error::namespace ${NAMESPACE} was not fully removed after cleanup"
            kubectl --kubeconfig="${HOST_KUBECONFIG}" get namespace "${NAMESPACE}" -o wide || true
            kubectl --kubeconfig="${HOST_KUBECONFIG}" describe namespace "${NAMESPACE}" || true
            return 1
          }

          provision_once() {
            kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
            kubectl label namespace "${NAMESPACE}" \
              nscleanup/enabled=true \
              nscleanup/ttl=7200 \
              dynamo.github/run-id="${GITHUB_RUN_ID}" \
              ngc-api=enabled \
              nvcr-imagepull=enabled \
              --overwrite

            vcluster create "${VCLUSTER_NAME}" \
              --namespace "${NAMESPACE}" \
              --connect=false \
              --upgrade \
              --set controlPlane.distro.k8s.enabled=true \
              --set controlPlane.distro.k8s.version=v1.31.4 \
              --set controlPlane.statefulSet.resources.requests.cpu="${VC_CP_REQ_CPU}" \
              --set controlPlane.statefulSet.resources.requests.memory="${VC_CP_REQ_MEM}" \
              --set controlPlane.statefulSet.resources.limits.cpu="${VC_CP_LIM_CPU}" \
              --set controlPlane.statefulSet.resources.limits.memory="${VC_CP_LIM_MEM}" \
              --set controlPlane.coredns.deployment.resources.requests.cpu="${VC_DNS_REQ_CPU}" \
              --set controlPlane.coredns.deployment.resources.requests.memory="${VC_DNS_REQ_MEM}" \
              --set controlPlane.coredns.deployment.resources.limits.cpu="${VC_DNS_LIM_CPU}" \
              --set controlPlane.coredns.deployment.resources.limits.memory="${VC_DNS_LIM_MEM}"

            if ! kubectl wait --for=condition=ready pod \
              -l "app=vcluster,release=${VCLUSTER_NAME}" \
              -n "${NAMESPACE}" \
              --timeout=900s; then
              echo "::warning::vcluster pod did not become Ready in ${NAMESPACE}; collecting scheduling diagnostics"
              kubectl get pod -n "${NAMESPACE}" -l "app=vcluster,release=${VCLUSTER_NAME}" -o wide || true
              VC_POD="$(kubectl get pod -n "${NAMESPACE}" -l "app=vcluster,release=${VCLUSTER_NAME}" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
              if [[ -n "${VC_POD}" ]]; then
                kubectl describe pod "${VC_POD}" -n "${NAMESPACE}" || true
              fi
              kubectl get events -n "${NAMESPACE}" --sort-by='.lastTimestamp' | tail -n 120 || true
              return 1
            fi

            cleanup_port_forward
            nohup kubectl port-forward -n "${NAMESPACE}" "svc/${VCLUSTER_NAME}" 8443:443 > "${PF_LOG}" 2>&1 &
            echo "$!" > "${PF_PID_FILE}"

            consecutive_ready=0
            for attempt in $(seq 1 90); do
              if curl -sk --connect-timeout 1 --max-time 2 https://127.0.0.1:8443/readyz >/dev/null; then
                consecutive_ready=$((consecutive_ready + 1))
              else
                consecutive_ready=0
              fi

              if [[ "${consecutive_ready}" -ge 3 ]]; then
                break
              fi

              if [[ "${attempt}" -eq 90 ]]; then
                echo "::error::vCluster API /readyz did not stabilize"
                tail -n 100 "${PF_LOG}" || true
                return 1
              fi
              sleep 2
            done

            for attempt in $(seq 1 5); do
              if vcluster connect "${VCLUSTER_NAME}" \
                --namespace "${NAMESPACE}" \
                --server=https://127.0.0.1:8443 \
                --print > "${KUBECONFIG_PATH}"; then
                break
              fi

              if [[ "${attempt}" -eq 5 ]]; then
                echo "::error::vcluster connect failed after ${attempt} attempts"
                return 1
              fi
              sleep $((attempt * 2))
            done

            kubectl --kubeconfig="${KUBECONFIG_PATH}" get ns
            kubectl --kubeconfig="${KUBECONFIG_PATH}" wait --for=condition=Available deployment/coredns -n kube-system --timeout=300s

            if [[ -n "${HF_TOKEN}" ]]; then
              kubectl --kubeconfig="${KUBECONFIG_PATH}" \
                create secret generic hf-token-secret \
                --from-literal=HF_TOKEN="${HF_TOKEN}" \
                -n default --dry-run=client -o yaml | kubectl --kubeconfig="${KUBECONFIG_PATH}" apply -f -
            fi

            if [[ "nvcr.io/nvidia/ai-dynamo/kubernetes-operator" == *"/"* ]]; then
              OPERATOR_REPO="nvcr.io/nvidia/ai-dynamo/kubernetes-operator"
            else
              OPERATOR_REPO="nvcr.io/nvidia/ai-dynamo/kubernetes-operator/ai-dynamo/dynamo"
            fi

            helm repo add bitnami https://charts.bitnami.com/bitnami
            pushd deploy/helm/charts/platform >/dev/null
            helm dep build .
            KUBECONFIG="${KUBECONFIG_PATH}" helm upgrade --install dynamo-platform . --namespace default \
              --set dynamo-operator.controllerManager.manager.image.repository="${OPERATOR_REPO}" \
              --set dynamo-operator.controllerManager.manager.image.tag="${OPERATOR_TAG}" \
              --set dynamo-operator.upgradeCRD=false \
              --set dynamo-operator.gpuDiscovery.enabled=false \
              --set dynamo-operator.checkpoint.enabled=false \
              --set global.grove.install=true \
              --set global.kai-scheduler.install=false \
              --debug
            popd >/dev/null

            kubectl --kubeconfig="${KUBECONFIG_PATH}" wait --for=condition=Available deployment/dynamo-platform-dynamo-operator-controller-manager -n default --timeout=900s
            kubectl --kubeconfig="${KUBECONFIG_PATH}" wait --for=condition=Available deployment/grove-operator -n default --timeout=300s

            WEBHOOK_READY=0
            for attempt in $(seq 1 30); do
              ENDPOINT_ADDR_COUNT=$(kubectl --kubeconfig="${KUBECONFIG_PATH}" get endpoints grove-operator -n default -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null | awk '{print NF}')
              ENDPOINTSLICE_READY_ADDR_COUNT=$(kubectl --kubeconfig="${KUBECONFIG_PATH}" get endpointslices -n default -l kubernetes.io/service-name=grove-operator -o jsonpath='{.items[*].endpoints[?(@.conditions.ready==true)].addresses[*]}' 2>/dev/null | awk '{print NF}')

              if [[ "${ENDPOINT_ADDR_COUNT}" -ge 1 || "${ENDPOINTSLICE_READY_ADDR_COUNT}" -ge 1 ]]; then
                WEBHOOK_READY=1
                break
              fi

              if (( attempt % 6 == 0 )); then
                echo "::warning::grove webhook endpoints not ready yet (attempt ${attempt}/30)"
                kubectl --kubeconfig="${KUBECONFIG_PATH}" get pods -n default -l app.kubernetes.io/name=grove-operator -o wide || true
              fi
              sleep 5
            done

            if [[ "${WEBHOOK_READY}" -ne 1 ]]; then
              PROBE_POD="webhook-probe-$(date +%s)"
              if kubectl --kubeconfig="${KUBECONFIG_PATH}" run "${PROBE_POD}" \
                -n default \
                --image=curlimages/curl:8.11.1 \
                --restart=Never \
                --rm \
                --attach \
                --quiet \
                --command -- sh -ceu 'for i in 1 2 3; do curl -sk --connect-timeout 2 --max-time 5 https://grove-operator.default.svc:9443/ >/dev/null && exit 0; sleep 2; done; exit 1'; then
                WEBHOOK_READY=1
              else
                WEBHOOK_READY=0
              fi
              kubectl --kubeconfig="${KUBECONFIG_PATH}" delete pod "${PROBE_POD}" -n default --ignore-not-found=true >/dev/null 2>&1 || true
            fi

            if [[ "${WEBHOOK_READY}" -ne 1 ]]; then
              echo "::error::grove-operator webhook service is not reachable after readiness and connectivity checks"
              kubectl --kubeconfig="${KUBECONFIG_PATH}" get svc,endpoints,endpointslices -n default | grep grove-operator || true
              kubectl --kubeconfig="${KUBECONFIG_PATH}" describe svc grove-operator -n default || true
              kubectl --kubeconfig="${KUBECONFIG_PATH}" get pods -n default -l app.kubernetes.io/name=grove-operator -o wide || true
              return 1
            fi

            KUBECONFIG_B64=$(base64 < "${KUBECONFIG_PATH}" | tr -d '\n')
            echo "kubeconfig_base64=${KUBECONFIG_B64}" >> "$GITHUB_OUTPUT"
            return 0
          }

          success=0
          for run_attempt in 1 2; do
            echo "::notice::Provisioning isolated vCluster attempt ${run_attempt}/2"
            if provision_once; then
              success=1
              break
            fi

            echo "::warning::Provision attempt ${run_attempt} failed"
            cleanup_port_forward
            if [[ "${run_attempt}" -lt 2 ]]; then
              echo "::notice::Cleaning up and retrying with a fresh isolated namespace"
              cleanup_namespace || true
              sleep 10
            fi
          done

          if [[ "${success}" -ne 1 ]]; then
            echo "::error::Failed to provision a healthy isolated vCluster after 2 attempts"
            exit 1
          fi

      - name: Run XPU Deploy Test
        uses: ./.github/actions/dynamo-deploy-test
        with:
          kubeconfig_base64: ${{ steps.isolated-cluster.outputs.kubeconfig_base64 }}
          namespace: default
          registry: ${{ env.LOCAL_REGISTRY }}
          operator_tag: ${{ steps.isolated-cluster.outputs.operator_tag }}
          hf_token: ${{ secrets.HF_TOKEN }}
          python_version: '3.12'
          framework: ${{ inputs.framework || 'vllm' }}
          profile: ${{ matrix.profile }}
          image: ${{ env.IMAGE_URI }}
          platform_arch: amd64
          test_name: ${{ inputs.framework || 'vllm' }}-${{ matrix.profile }}
          extra_pytest_args: -m "framework_only and xpu_1"

      - name: Cleanup isolated vCluster namespace
        if: always() && steps.isolated-cluster.outputs.namespace != ''
        shell: bash
        run: |
          set -euo pipefail

          NAMESPACE="${{ steps.isolated-cluster.outputs.namespace }}"

          echo "Using host kubeconfig: ${HOST_KUBECONFIG:-<unset>}"
          kubectl --kubeconfig="${HOST_KUBECONFIG}" delete namespace "${NAMESPACE}" --ignore-not-found=true --timeout=180s || true

          for _ in $(seq 1 60); do
            if ! kubectl --kubeconfig="${HOST_KUBECONFIG}" get namespace "${NAMESPACE}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          echo "::error::namespace ${NAMESPACE} was not fully removed after final cleanup"
          kubectl --kubeconfig="${HOST_KUBECONFIG}" get namespace "${NAMESPACE}" -o wide || true
          kubectl --kubeconfig="${HOST_KUBECONFIG}" describe namespace "${NAMESPACE}" || true
          exit 1