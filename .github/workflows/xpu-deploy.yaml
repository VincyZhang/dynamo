name: XPU-Deploy

on:
  workflow_dispatch:
    inputs:
      framework:
        description: 'Framework name (vllm)'
        required: false
        type: string
        default: 'vllm'
      source_ref:
        description: 'Git ref/SHA to checkout. Empty = current SHA.'
        required: false
        type: string
        default: ''
      registry_host:
        description: 'Local registry host to push images to.'
        required: false
        type: string
        default: 'localhost:5000'
  workflow_call:
    inputs:
      framework:
        description: 'Framework name (vllm)'
        required: false
        type: string
        default: 'vllm'
      source_ref:
        description: 'Git ref/SHA to checkout. Empty = caller SHA.'
        required: false
        type: string
        default: ''
      registry_host:
        description: 'Local registry host to push images to.'
        required: false
        type: string
        default: 'localhost:5000'
    secrets:
      HF_TOKEN:
        required: true
      DOCKERHUB_LOGIN_USER:
        required: true
      DOCKERHUB_ACCESS_TOKEN:
        required: true

concurrency:
  group: xpu-deploy-host-k8s
  cancel-in-progress: false

env:
  FRAMEWORK: ${{ inputs.framework || 'vllm' }}
  SOURCE_REF: ${{ inputs.source_ref || github.sha }}
  LOCAL_REGISTRY: ${{ inputs.registry_host || 'localhost:5000' }}
  TARGET: runtime
  DEVICE: xpu
  PLATFORM: linux/amd64

jobs:
  deploy-test-xpu:
    runs-on: xpu-deploy
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - profile: agg_xpu_dra
            name: agg_xpu_dra
            slug: agg-xpu-dra
          - profile: disagg_xpu_dra
            name: disagg_xpu_dra
            slug: disagg-xpu-dra
    name: ${{ matrix.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Generate Dockerfile
        shell: bash
        run: |
          echo "::group::Generating XPU Dockerfile"
          python3 ./container/render.py \
              --target=${{ env.TARGET }} \
              --framework=${{ env.FRAMEWORK }} \
              --device=${{ env.DEVICE }} \
              --platform=${{ env.PLATFORM }} \
              --show-result \
              --output-short-filename
          echo "::endgroup::"

      - name: Build local XPU image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_URI="${LOCAL_REGISTRY}/ai-dynamo/dynamo:${SOURCE_REF}-${FRAMEWORK}-${TARGET}-xpu"

          docker build \
            --tag "${IMAGE_URI}" \
            -f ./container/rendered.Dockerfile \
            . 2>&1 | tee "build-${{ matrix.name }}.log"

          docker push "${IMAGE_URI}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Setup Kubernetes namespace and operator
        id: k8s-setup
        shell: bash
        env:
          MATRIX_NAME: ${{ matrix.name }}
          MATRIX_SLUG: ${{ matrix.slug }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -Eeuo pipefail

          HELM_BIN="${HOME}/.local/bin/helm"
          if [[ ! -x "${HELM_BIN}" ]]; then
            echo "::error::helm binary is required on xpu-deploy runner but was not found at ${HELM_BIN}"
            exit 1
          fi

          NAMESPACE="gh-id-${GITHUB_RUN_ID}-${MATRIX_SLUG}-xpu"
          OPERATOR_TAG="1.2.1"
          KUBECONFIG_PATH="${HOME}/.kube/config"
          NAMESPACE_CREATED=0

          cleanup_setup_namespace() {
            if [[ "${NAMESPACE_CREATED}" -ne 1 ]]; then
              return 0
            fi

            echo "::warning::[$(date -u +%H:%M:%S)] setup failed, deleting namespace ${NAMESPACE}"
            kubectl --kubeconfig="${KUBECONFIG_PATH}" delete namespace "${NAMESPACE}" --ignore-not-found=true --timeout=180s >/dev/null 2>&1 || true
          }

          trap cleanup_setup_namespace EXIT

          echo "namespace=${NAMESPACE}" >> "$GITHUB_OUTPUT"
          echo "operator_tag=${OPERATOR_TAG}" >> "$GITHUB_OUTPUT"

          echo "::notice::[$(date -u +%H:%M:%S)] creating namespace ${NAMESPACE}"
          kubectl --kubeconfig="${KUBECONFIG_PATH}" create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl --kubeconfig="${KUBECONFIG_PATH}" apply -f -
          NAMESPACE_CREATED=1
          kubectl --kubeconfig="${KUBECONFIG_PATH}" label namespace "${NAMESPACE}" \
            nscleanup/enabled=true \
            nscleanup/ttl=7200 \
            dynamo.github/run-id="${GITHUB_RUN_ID}" \
            ngc-api=enabled \
            nvcr-imagepull=enabled \
            --overwrite

          kubectl --kubeconfig="${KUBECONFIG_PATH}" annotate namespace "${NAMESPACE}" \
            dynamo.github/workflow="xpu-deploy" \
            dynamo.github/runner="host-k8s" \
            dynamo.github/run-attempt="${GITHUB_RUN_ATTEMPT}" \
            --overwrite

          kubectl --kubeconfig="${KUBECONFIG_PATH}" auth can-i create namespace >/dev/null
          kubectl --kubeconfig="${KUBECONFIG_PATH}" auth can-i create deployment -n "${NAMESPACE}" >/dev/null
          kubectl --kubeconfig="${KUBECONFIG_PATH}" auth can-i create validatingwebhookconfigurations >/dev/null

          echo "::notice::[$(date -u +%H:%M:%S)] waiting for namespace to be ready"
          kubectl --kubeconfig="${KUBECONFIG_PATH}" wait --for=jsonpath='{.status.phase}'=Active namespace/"${NAMESPACE}" --timeout=60s

          if [[ -n "${HF_TOKEN}" ]]; then
            kubectl --kubeconfig="${KUBECONFIG_PATH}" \
              create secret generic hf-token-secret \
              --from-literal=HF_TOKEN="${HF_TOKEN}" \
              -n "${NAMESPACE}" --dry-run=client -o yaml | kubectl --kubeconfig="${KUBECONFIG_PATH}" apply -f -
          fi

          echo "::notice::[$(date -u +%H:%M:%S)] installing operator and grove"
          if [[ "nvcr.io/nvidia/ai-dynamo/kubernetes-operator" == *"/"* ]]; then
            OPERATOR_REPO="nvcr.io/nvidia/ai-dynamo/kubernetes-operator"
          else
            OPERATOR_REPO="nvcr.io/nvidia/ai-dynamo/kubernetes-operator/ai-dynamo/dynamo"
          fi

          "${HELM_BIN}" repo add bitnami https://charts.bitnami.com/bitnami
          pushd deploy/helm/charts/platform >/dev/null
          "${HELM_BIN}" dep build .
          KUBECONFIG="${KUBECONFIG_PATH}" "${HELM_BIN}" upgrade --install dynamo-platform . --namespace "${NAMESPACE}" \
            --set dynamo-operator.controllerManager.manager.image.repository="${OPERATOR_REPO}" \
            --set dynamo-operator.controllerManager.manager.image.tag="${OPERATOR_TAG}" \
            --set dynamo-operator.upgradeCRD=false \
            --set dynamo-operator.gpuDiscovery.enabled=false \
            --set dynamo-operator.checkpoint.enabled=false \
            --set global.grove.install=true \
            --set global.kai-scheduler.install=false \
            --take-ownership \
            --atomic \
            --wait \
            --timeout 10m \
            --debug
          popd >/dev/null

          echo "::notice::[$(date -u +%H:%M:%S)] waiting for dynamo-operator to be ready"
          kubectl --kubeconfig="${KUBECONFIG_PATH}" wait --for=condition=Available deployment/dynamo-platform-dynamo-operator-controller-manager -n "${NAMESPACE}" --timeout=600s

          echo "::notice::[$(date -u +%H:%M:%S)] waiting for grove-operator to be ready"
          kubectl --kubeconfig="${KUBECONFIG_PATH}" wait --for=condition=Available deployment/grove-operator -n "${NAMESPACE}" --timeout=300s

          WEBHOOK_READY=0
          for attempt in $(seq 1 30); do
            ENDPOINT_ADDR_COUNT=$(kubectl --kubeconfig="${KUBECONFIG_PATH}" get endpoints grove-operator -n "${NAMESPACE}" -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null | awk '{print NF}')
            ENDPOINTSLICE_READY_ADDR_COUNT=$(kubectl --kubeconfig="${KUBECONFIG_PATH}" get endpointslices -n "${NAMESPACE}" -l kubernetes.io/service-name=grove-operator -o jsonpath='{.items[*].endpoints[?(@.conditions.ready==true)].addresses[*]}' 2>/dev/null | awk '{print NF}')

            if [[ "${ENDPOINT_ADDR_COUNT}" -ge 1 || "${ENDPOINTSLICE_READY_ADDR_COUNT}" -ge 1 ]]; then
              WEBHOOK_READY=1
              break
            fi

            if (( attempt % 6 == 0 )); then
              echo "::warning::grove webhook endpoints not ready yet (attempt ${attempt}/30)"
              kubectl --kubeconfig="${KUBECONFIG_PATH}" get pods -n "${NAMESPACE}" -l app.kubernetes.io/name=grove-operator -o wide || true
            fi
            sleep 5
          done

          if [[ "${WEBHOOK_READY}" -ne 1 ]]; then
            PROBE_POD="webhook-probe-$(date +%s)"
            if kubectl --kubeconfig="${KUBECONFIG_PATH}" run "${PROBE_POD}" \
              -n "${NAMESPACE}" \
              --image=curlimages/curl:8.11.1 \
              --restart=Never \
              --rm \
              --attach \
              --quiet \
              --command -- sh -ceu "for i in 1 2 3; do curl -sk --connect-timeout 2 --max-time 5 https://grove-operator.${NAMESPACE}.svc:9443/ >/dev/null && exit 0; sleep 2; done; exit 1"; then
              WEBHOOK_READY=1
            else
              WEBHOOK_READY=0
            fi
            kubectl --kubeconfig="${KUBECONFIG_PATH}" delete pod "${PROBE_POD}" -n "${NAMESPACE}" --ignore-not-found=true --wait=true --timeout=60s >/dev/null 2>&1 || true
          fi

          if [[ "${WEBHOOK_READY}" -ne 1 ]]; then
            echo "::error::grove-operator webhook service is not reachable after readiness and connectivity checks"
            kubectl --kubeconfig="${KUBECONFIG_PATH}" get svc,endpoints,endpointslices -n "${NAMESPACE}" | grep grove-operator || true
            kubectl --kubeconfig="${KUBECONFIG_PATH}" describe svc grove-operator -n "${NAMESPACE}" || true
            kubectl --kubeconfig="${KUBECONFIG_PATH}" get pods -n "${NAMESPACE}" -l app.kubernetes.io/name=grove-operator -o wide || true
            exit 1
          fi

          KUBECONFIG_B64=$(base64 < "${KUBECONFIG_PATH}" | tr -d '\n')
          echo "kubeconfig_base64=${KUBECONFIG_B64}" >> "$GITHUB_OUTPUT"
          trap - EXIT

      - name: Run XPU Deploy Test
        uses: ./.github/actions/dynamo-deploy-test
        with:
          kubeconfig_base64: ${{ steps.k8s-setup.outputs.kubeconfig_base64 }}
          namespace: ${{ steps.k8s-setup.outputs.namespace }}
          registry: ${{ env.LOCAL_REGISTRY }}
          operator_tag: ${{ steps.k8s-setup.outputs.operator_tag }}
          hf_token: ${{ secrets.HF_TOKEN }}
          framework: ${{ inputs.framework || 'vllm' }}
          profile: ${{ matrix.profile }}
          image: ${{ env.IMAGE_URI }}
          platform_arch: amd64
          test_name: ${{ inputs.framework || 'vllm' }}-${{ matrix.profile }}
          extra_pytest_args: -m "framework_only and xpu_1"

      - name: Dump Kubernetes pod logs
        if: always() && steps.k8s-setup.outputs.namespace != ''
        shell: bash
        run: |
          set -euo pipefail

          NAMESPACE="${{ steps.k8s-setup.outputs.namespace }}"
          KUBECONFIG_PATH="${HOME}/.kube/config"

          echo "::group::Pod inventory for ${NAMESPACE}"
          kubectl --kubeconfig="${KUBECONFIG_PATH}" get pods -n "${NAMESPACE}" -o wide || true
          echo "::endgroup::"

          PODS=$(kubectl --kubeconfig="${KUBECONFIG_PATH}" get pods -n "${NAMESPACE}" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)
          if [[ -z "${PODS}" ]]; then
            echo "::warning::No pods found in ${NAMESPACE} when attempting to dump logs"
            exit 0
          fi

          for POD in ${PODS}; do
            echo "::group::kubectl describe pod/${POD}"
            kubectl --kubeconfig="${KUBECONFIG_PATH}" describe pod "${POD}" -n "${NAMESPACE}" || true
            echo "::endgroup::"

            CONTAINERS=$(kubectl --kubeconfig="${KUBECONFIG_PATH}" get pod "${POD}" -n "${NAMESPACE}" -o jsonpath='{range .spec.containers[*]}{.name}{"\n"}{end}' 2>/dev/null || true)
            if [[ -z "${CONTAINERS}" ]]; then
              echo "::warning::No containers found for pod ${POD}"
              continue
            fi

            for CONTAINER in ${CONTAINERS}; do
              echo "::group::kubectl logs pod/${POD} container/${CONTAINER}"
              kubectl --kubeconfig="${KUBECONFIG_PATH}" logs "${POD}" -n "${NAMESPACE}" -c "${CONTAINER}" --all-containers=false --tail=300 --timestamps=true --prefix=true || true
              echo "::endgroup::"

              if kubectl --kubeconfig="${KUBECONFIG_PATH}" get pod "${POD}" -n "${NAMESPACE}" -o jsonpath="{.status.containerStatuses[?(@.name=='${CONTAINER}')].restartCount}" 2>/dev/null | grep -Eq '^[1-9]'; then
                echo "::group::kubectl logs --previous pod/${POD} container/${CONTAINER}"
                kubectl --kubeconfig="${KUBECONFIG_PATH}" logs "${POD}" -n "${NAMESPACE}" -c "${CONTAINER}" --previous --tail=300 --timestamps=true --prefix=true || true
                echo "::endgroup::"
              fi
            done
          done

      - name: Cleanup Kubernetes namespace
        if: always() && steps.k8s-setup.outputs.namespace != ''
        shell: bash
        run: |
          set -euo pipefail

          NAMESPACE="${{ steps.k8s-setup.outputs.namespace }}"
          KUBECONFIG_PATH="${HOME}/.kube/config"
          CLEANUP_TIMEOUT=180s
          FINAL_WAIT_SECONDS=120

          strip_finalizers() {
            local resource_name
            local resource_kind

            resource_name="$1"
            resource_kind="$2"

            kubectl --kubeconfig="${KUBECONFIG_PATH}" get "${resource_name}" -n "${NAMESPACE}" -o name 2>/dev/null \
              | while read -r obj; do
                  if [[ -n "${obj}" ]]; then
                    echo "Stripping finalizers from ${resource_kind}/${obj##*/}"
                    kubectl --kubeconfig="${KUBECONFIG_PATH}" patch "${obj}" -n "${NAMESPACE}" --type merge -p '{"metadata":{"finalizers":[]}}' || true
                  fi
                done
          }

          strip_finalizers "podcliquesets.grove.io" "podcliqueset"
          strip_finalizers "podcliques.grove.io" "podclique"

          echo "Deleting namespace ${NAMESPACE}"
          kubectl --kubeconfig="${KUBECONFIG_PATH}" delete namespace "${NAMESPACE}" --ignore-not-found=true --timeout="${CLEANUP_TIMEOUT}" || true

          for _ in $(seq 1 ${FINAL_WAIT_SECONDS}); do
            if ! kubectl --kubeconfig="${KUBECONFIG_PATH}" get namespace "${NAMESPACE}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done

          echo "::error::namespace ${NAMESPACE} was not fully removed after final cleanup"
          kubectl --kubeconfig="${KUBECONFIG_PATH}" get namespace "${NAMESPACE}" -o wide || true
          kubectl --kubeconfig="${KUBECONFIG_PATH}" describe namespace "${NAMESPACE}" || true
          exit 1