name: PR-XPU

on:
  push:
    branches:
      - "pull-request/[0-9]+"

concurrency:
  group: pr-xpu-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # Temporary PR-XPU shape:
  # - Keep the file on pull_request so the workflow can be validated on PRs.
  # - Temporarily disable the old label gate and xpu-ci fan-out.
  # - Run the deploy test directly through the reusable xpu-deploy workflow.
