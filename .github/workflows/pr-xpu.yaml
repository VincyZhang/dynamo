name: PR-XPU

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-xpu-${{ github.ref_name }}
  cancel-in-progress: true

jobs:

  # ============================================================================
  # GATE – only run XPU CI when the PR has the "xpu" label.
  # Push trigger (pull-request/* branch) already guarantees only internal
  # users / copy-pr-bot can reach this workflow.
  # ============================================================================

  # guard:
  #   runs-on: ubuntu-latest
  #   outputs:
  #     has_xpu_label: ${{ steps.pr-info.outputs.has_xpu_label }}
  #   steps:
  #     - name: Get PR info and check xpu label
  #       id: pr-info
  #       run: |
  #         # Guard bypassed – always run XPU CI
  #         echo "has_xpu_label=true" >> "$GITHUB_OUTPUT"
  #         echo "✅ Guard bypassed – running XPU CI unconditionally"
  guard:
    runs-on: ubuntu-latest
    outputs:
      has_xpu_label: 'true'
    steps:
      - run: echo "Guard disabled – always true"

  # ============================================================================
  # CHANGE DETECTION
  # ============================================================================

  changed-files:
    needs: [guard]
    if: always() && needs.guard.outputs.has_xpu_label == 'true'
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.changes.outputs.core }}
      vllm: ${{ steps.changes.outputs.vllm }}
      sglang: ${{ steps.changes.outputs.sglang }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
        with:
          fetch-depth: 0
      - name: Check for changes
        id: changes
        uses: ./.github/actions/changed-files
        with:
          gh_token: ${{ github.token }}

  # ============================================================================
  # XPU CI – VLLM
  # ============================================================================

  xpu-ci-vllm:
    needs: [changed-files]
    if: >-
      needs.changed-files.outputs.core == 'true' ||
      needs.changed-files.outputs.vllm == 'true'
    uses: ./.github/workflows/xpu-ci.yaml
    with:
      framework: vllm
      pytest_markers: 'vllm and xpu_1 and pre_merge and not multimodal'

  # ============================================================================
  # STATUS CHECK
  # ============================================================================

  xpu-status-check:
    runs-on: ubuntu-latest
    needs: [guard, changed-files, xpu-ci-vllm]
    if: always() && needs.guard.outputs.has_xpu_label == 'true'
    steps:
      - name: Check all XPU jobs
        run: |
          echo '${{ toJson(needs) }}' | jq -e 'to_entries | map(.value.result) | all(. as $result | ["success", "skipped"] | any($result == .))'
