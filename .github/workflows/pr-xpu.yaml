name: PR-XPU

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-xpu-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:

  # ============================================================================
  # GATE – temporarily disabled while we narrow PR-XPU to a targeted repro.
  # The workflow now runs on pull_request directly and the label gate is kept
  # out of the path until this repro is finished.
  # ============================================================================
  # guard:
  #   runs-on: ubuntu-latest
  #   outputs:
  #     has_xpu_label: ${{ steps.pr-info.outputs.has_xpu_label }}
  #   steps:
  #     - name: Get PR info and check xpu label
  #       id: pr-info
  #       env:
  #         GH_TOKEN: ${{ github.token }}
  #       run: |
  #         PR_NUMBER="${GITHUB_REF_NAME##*/}"
  #         HAS_XPU=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
  #           --jq '[.labels[].name] | any(. == "xpu")')
  #         echo "has_xpu_label=${HAS_XPU}" >> "$GITHUB_OUTPUT"
  #         if [[ "${HAS_XPU}" == "true" ]]; then
  #           echo "✅ PR #${PR_NUMBER} has 'xpu' label – running XPU CI"
  #         else
  #           echo "⏭️ PR #${PR_NUMBER} does not have 'xpu' label – skipping XPU CI"
  #         fi

  # ============================================================================
  # CHANGE DETECTION
  # ============================================================================

  changed-files:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.changes.outputs.core }}
      vllm: ${{ steps.changes.outputs.vllm }}
      sglang: ${{ steps.changes.outputs.sglang }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
        with:
          fetch-depth: 0
      - name: Check for changes
        id: changes
        uses: ./.github/actions/changed-files
        with:
          gh_token: ${{ github.token }}

  # ============================================================================
  # XPU CI – VLLM
  # ============================================================================

  xpu-ci-vllm:
    needs: [changed-files]
    if: >-
      needs.changed-files.outputs.core == 'true' ||
      needs.changed-files.outputs.vllm == 'true'
    uses: ./.github/workflows/xpu-ci.yaml
    with:
      framework: vllm
      pytest_markers: 'vllm and not multimodal'
      pytest_targets: >-
        tests/fault_tolerance/cancellation/test_vllm.py::test_request_cancellation_vllm_aggregated[nats]
        tests/fault_tolerance/cancellation/test_vllm.py::test_request_cancellation_vllm_aggregated[tcp]
      run_xpu_2card_tests: 'false'

  # ============================================================================
  # STATUS CHECK
  # ============================================================================

  xpu-status-check:
    runs-on: ubuntu-latest
    needs: [changed-files, xpu-ci-vllm]
    if: always()
    steps:
      - name: Check all XPU jobs
        run: |
          echo '${{ toJson(needs) }}' | jq -e 'to_entries | map(.value.result) | all(. as $result | ["success", "skipped"] | any($result == .))'
