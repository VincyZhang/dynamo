name: 'Bootstrap Buildkit'
description: 'Bootstrap buildkit builders using remote workers or Kubernetes driver'

# This action supports two buildkit driver modes:
#
# 1. Remote Driver (when buildkit_worker_addresses is provided)
#    Uses pre-provisioned remote buildkit workers specified via buildkit_worker_addresses.
#    This is the preferred mode for faster, more reliable builds.
#
# 2. Kubernetes Driver (fallback, when buildkit_worker_addresses is empty)
#    Dynamically creates buildkit pods in Kubernetes. Use this as a fallback when
#    remote buildkit workers are unavailable or unreachable. The Kubernetes driver
#    is slower due to pod startup time but provides on-demand build capacity.
#
# Options:
#   - skip_bootstrap: Set to 'true' to only create the builder without bootstrapping.
#     Useful for cleanup jobs that need to remove the builder but not bootstrap it.

inputs:
  builder_name:
    description: 'Name for the buildx builder'
    required: true
  buildkit_worker_addresses:
    description: 'Comma-separated list of remote buildkit worker addresses. If empty, falls back to Kubernetes driver.'
    required: false
    default: ''


  # Kubernetes driver inputs (used when remote_builder is false)
  ephemeral_storage:
    description: 'Ephemeral storage request for Kubernetes driver'
    required: false
    default: '400Gi'
  namespace:
    description: 'Kubernetes namespace for buildkit pods'
    required: false
    default: 'buildkit'
  arch:
    description: 'Target architecture for fallback kubernetes builder (amd64, arm64, all)'
    required: false
    default: 'all'
  replicas:
    description: 'Number of buildkit replicas'
    required: false
    default: '1'
  requests_cpu:
    description: 'CPU requests for buildkit pods'
    required: false
    default: '12'
  requests_memory:
    description: 'Memory requests for buildkit pods'
    required: false
    default: '26Gi'
  limits_memory:
    description: 'Memory limits for buildkit pods'
    required: false
    default: '29Gi'
  tolerations:
    description: 'Tolerations for buildkit pods'
    required: false
    default: "key=buildkit-fallback-worker,value=true,operator=Equal,effect=NoSchedule"
  skip_bootstrap:
    description: 'Skip the bootstrap step (only create the builder)'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      with:
        install: true

    - name: Define remote buildkit builders
      if: inputs.buildkit_worker_addresses != ''
      shell: bash
      run: |
        run_buildx_create() {
          local -a args=("$@")
          local output rc unknown

          while true; do
            output=$(docker buildx create "${args[@]}" 2>&1)
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "$output"
              return 0
            fi

            unknown=$(echo "$output" | sed -n "s/.*unknown flag: \(--[^ ,;]*\).*/\1/p" | head -n 1)
            if [ -z "$unknown" ]; then
              echo "$output" >&2
              return $rc
            fi

            echo "::warning::docker buildx create does not support ${unknown}; retrying without it." >&2

            local -a filtered=()
            local skip_next=false
            local token next
            for ((i=0; i<${#args[@]}; i++)); do
              token="${args[$i]}"
              if $skip_next; then
                skip_next=false
                continue
              fi

              if [[ "$token" == "$unknown" ]]; then
                if (( i + 1 < ${#args[@]} )); then
                  next="${args[$((i+1))]}"
                  if [[ "$next" != --* ]]; then
                    skip_next=true
                  fi
                fi
                continue
              fi

              if [[ "$token" == "${unknown}="* ]]; then
                continue
              fi

              filtered+=("$token")
            done

            if [ ${#filtered[@]} -eq ${#args[@]} ]; then
              echo "$output" >&2
              return $rc
            fi

            args=("${filtered[@]}")
          done
        }

        ADDRS="${{ inputs.buildkit_worker_addresses }}"
        IFS=',' read -ra ADDR_LIST <<< "$ADDRS"
        SUPPORTS_NAME=false
        if docker buildx create --help | grep -q -- '--name'; then
          SUPPORTS_NAME=true
        fi

        FIRST=true
        RESOLVED_BUILDER="${{ inputs.builder_name }}"
        for addr in "${ADDR_LIST[@]}"; do
          if $FIRST; then
            local_create_output=""
            if $SUPPORTS_NAME; then
              local_create_output=$(run_buildx_create --name "${RESOLVED_BUILDER}" --driver remote "$addr")
            else
              # Legacy buildx without --name returns the created builder name on stdout.
              local_create_output=$(run_buildx_create --driver remote "$addr")
              RESOLVED_BUILDER=$(echo "$local_create_output" | tr -d '\r' | tail -n 1)
              if [ -z "$RESOLVED_BUILDER" ]; then
                echo "::error::Failed to resolve builder name from buildx create output"
                exit 1
              fi
            fi

            if $SUPPORTS_NAME && ! docker buildx inspect "${RESOLVED_BUILDER}" >/dev/null 2>&1; then
              detected_name=$(echo "$local_create_output" | tr -d '\r' | tail -n 1)
              if [ -n "$detected_name" ]; then
                RESOLVED_BUILDER="$detected_name"
              fi
            fi

            docker buildx use "${RESOLVED_BUILDER}"
            FIRST=false
          else
            if $SUPPORTS_NAME; then
              run_buildx_create --append --name "${RESOLVED_BUILDER}" --driver remote "$addr" >/dev/null
            else
              docker buildx use "${RESOLVED_BUILDER}"
              BUILDX_BUILDER="${RESOLVED_BUILDER}" run_buildx_create --append --driver remote "$addr" >/dev/null
            fi
          fi
        done
        echo "BUILDX_BUILDER_NAME=${RESOLVED_BUILDER}" >> "$GITHUB_ENV"

    - name: Create Kubernetes builder
      if: inputs.buildkit_worker_addresses == ''
      shell: bash
      run: |
        run_buildx_create() {
          local -a args=("$@")
          local output rc unknown

          while true; do
            output=$(docker buildx create "${args[@]}" 2>&1)
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "$output"
              return 0
            fi

            unknown=$(echo "$output" | sed -n "s/.*unknown flag: \(--[^ ,;]*\).*/\1/p" | head -n 1)
            if [ -z "$unknown" ]; then
              echo "$output" >&2
              return $rc
            fi

            echo "::warning::docker buildx create does not support ${unknown}; retrying without it." >&2

            local -a filtered=()
            local skip_next=false
            local token next
            for ((i=0; i<${#args[@]}; i++)); do
              token="${args[$i]}"
              if $skip_next; then
                skip_next=false
                continue
              fi

              if [[ "$token" == "$unknown" ]]; then
                if (( i + 1 < ${#args[@]} )); then
                  next="${args[$((i+1))]}"
                  if [[ "$next" != --* ]]; then
                    skip_next=true
                  fi
                fi
                continue
              fi

              if [[ "$token" == "${unknown}="* ]]; then
                continue
              fi

              filtered+=("$token")
            done

            if [ ${#filtered[@]} -eq ${#args[@]} ]; then
              echo "$output" >&2
              return $rc
            fi

            args=("${filtered[@]}")
          done
        }

        TARGET_ARCH="${{ inputs.arch }}"
        SUPPORTS_NAME=false
        if docker buildx create --help | grep -q -- '--name'; then
          SUPPORTS_NAME=true
        fi
        RESOLVED_BUILDER="${{ inputs.builder_name }}"

        case "$TARGET_ARCH" in
          amd64|arm64|all) ;;
          *)
            echo "::error::Invalid arch '$TARGET_ARCH'. Must be amd64, arm64, or all."
            exit 1
            ;;
        esac

        if $SUPPORTS_NAME && docker buildx inspect "${RESOLVED_BUILDER}" > /dev/null 2>&1; then
            # If exit code is 0 (success), print the message
            echo "✅ Builder '${RESOLVED_BUILDER}' already exists. Skipping creation."
            docker buildx use "${RESOLVED_BUILDER}"
        else
          echo "K8s Builder '${RESOLVED_BUILDER}' does not exist. Creating it for arch=$TARGET_ARCH."

          create_node() {
            local mode="$1"      # use|append
            local arch="$2"      # amd64|arm64
            local selector="kubernetes.io/arch=${arch},role=dynamo-builder-fallback"
            local selector_escaped="${selector//,/\\,}"
            local tolerations_escaped="${{ inputs.tolerations }}"
            tolerations_escaped="${tolerations_escaped//,/\\,}"

            local cmd=(docker buildx create)
            if [[ "$mode" == "append" ]]; then
              cmd+=(--append)
            fi

            if $SUPPORTS_NAME; then
              cmd+=(--name "${RESOLVED_BUILDER}")
            fi
            cmd+=(--driver kubernetes --platform="linux/${arch}")
            cmd+=("--driver-opt=requests.ephemeral-storage=${{ inputs.ephemeral_storage }}")
            cmd+=("--driver-opt=namespace=${{ inputs.namespace }}")
            cmd+=("--driver-opt=loadbalance=sticky")
            cmd+=("--driver-opt=replicas=${{ inputs.replicas }}")
            cmd+=("--driver-opt=requests.cpu=${{ inputs.requests_cpu }}")
            cmd+=("--driver-opt=requests.memory=${{ inputs.requests_memory }}")
            cmd+=("--driver-opt=limits.memory=${{ inputs.limits_memory }}")
            cmd+=("--driver-opt=nodeselector=${selector_escaped}")
            cmd+=("--driver-opt=tolerations=${tolerations_escaped}")

            local create_output=""
            local create_ok=false
            if $SUPPORTS_NAME; then
              if create_output=$(run_buildx_create "${cmd[@]}" 2>&1); then
                create_ok=true
              else
                create_output=""
              fi
            else
              if [[ "$mode" == "append" ]]; then
                if create_output=$(BUILDX_BUILDER="${RESOLVED_BUILDER}" run_buildx_create "${cmd[@]}" 2>&1); then
                  create_ok=true
                else
                  create_output=""
                fi
              else
                if create_output=$(run_buildx_create "${cmd[@]}" 2>&1); then
                  create_ok=true
                else
                  create_output=""
                fi
              fi
            fi

            if $create_ok; then
              if ! $SUPPORTS_NAME && [[ "$mode" != "append" ]]; then
                local created_name=""
                created_name=$(echo "$create_output" | tr -d '\r' | tail -n 1)
                if [ -n "$created_name" ]; then
                  RESOLVED_BUILDER="$created_name"
                fi
              fi
              return 0
            fi

            echo "::warning::Primary node selector failed for ${arch}. Retrying without role selector."
            selector="kubernetes.io/arch=${arch}"
            selector_escaped="${selector//,/\\,}"
            cmd=(docker buildx create)
            if [[ "$mode" == "append" ]]; then
              cmd+=(--append)
            fi
            if $SUPPORTS_NAME; then
              cmd+=(--name "${RESOLVED_BUILDER}")
            fi
            cmd+=(--driver kubernetes --platform="linux/${arch}")
            cmd+=("--driver-opt=requests.ephemeral-storage=${{ inputs.ephemeral_storage }}")
            cmd+=("--driver-opt=namespace=${{ inputs.namespace }}")
            cmd+=("--driver-opt=loadbalance=sticky")
            cmd+=("--driver-opt=replicas=${{ inputs.replicas }}")
            cmd+=("--driver-opt=requests.cpu=${{ inputs.requests_cpu }}")
            cmd+=("--driver-opt=requests.memory=${{ inputs.requests_memory }}")
            cmd+=("--driver-opt=limits.memory=${{ inputs.limits_memory }}")
            cmd+=("--driver-opt=nodeselector=${selector_escaped}")

            if $SUPPORTS_NAME; then
              run_buildx_create "${cmd[@]}"
            elif [[ "$mode" == "append" ]]; then
              BUILDX_BUILDER="${RESOLVED_BUILDER}" run_buildx_create "${cmd[@]}"
            else
              local retry_output=""
              retry_output=$(run_buildx_create "${cmd[@]}")
              local retry_created_name=""
              retry_created_name=$(echo "$retry_output" | tr -d '\r' | tail -n 1)
              if [ -n "$retry_created_name" ]; then
                RESOLVED_BUILDER="$retry_created_name"
              fi
            fi
          }

          if [[ "$TARGET_ARCH" == "amd64" ]]; then
            create_node use amd64
          elif [[ "$TARGET_ARCH" == "arm64" ]]; then
            create_node use arm64
          else
            create_node use amd64
            create_node append arm64
          fi

          docker buildx use "${RESOLVED_BUILDER}"
        fi
        echo "BUILDX_BUILDER_NAME=${RESOLVED_BUILDER}" >> "$GITHUB_ENV"
        sleep 3 # Give the builders some time to be ready

        if [[ "${{ inputs.skip_bootstrap }}" != "true" ]]; then
          echo "::warning::Build is using fallback pod. Please alert the ops team."
          echo "## ⚠️ Fallback Build Warning" >> $GITHUB_STEP_SUMMARY
          echo "This build is running on a **fallback pod**. Please alert the ops team." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi


    - name: Bootstrap buildkit
      if: inputs.skip_bootstrap != 'true'
      shell: bash
      run: |
        BUILDER_NAME="${BUILDX_BUILDER_NAME:-${{ inputs.builder_name }}}"
        echo "Bootstrapping buildkit..."
        for i in 1 2 3; do
          if docker buildx inspect "$BUILDER_NAME" --bootstrap; then
            echo "Bootstrap succeeded on attempt $i"
            break
          fi
          if [ "$i" -eq 3 ]; then
            echo "::error::Bootstrap failed after 3 attempts"
            exit 1
          fi
          echo "::warning::Bootstrap attempt $i failed, retrying in 10s..."
          sleep 10
        done
